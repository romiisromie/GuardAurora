  <script>
    const policies={
      ru:{title:'Политика конфиденциальности',updated:'Обновлено: 8 октября 2026 г.',sections:[
        ['1. Оператор','Оператор приложения GuardAurora — Рамина Ибраимова (Казахстан). По вопросам конфиденциальности и обработки данных: <a href="mailto:romiisromie@gmail.com">romiisromie@gmail.com</a>.'],
        ['2. Данные и разрешения','Имя и номер доверенного контакта, записи журнала и координаты хранятся локально на устройстве. Разрешение на геолокацию запрашивается только по нажатию пользователя. Если разрешение уже выдано, при запуске SOS приложение один раз определяет текущие координаты и добавляет их к локальной записи SOS; фоновое отслеживание не ведётся. При включённом мониторинге микрофон измеряет общий уровень звука, пока приложение открыто. Для измерения создаётся временный аудиофайл в кэше устройства; он удаляется при остановке мониторинга или переходе приложения в фон. Звуки и угрозы не распознаются.'],
        ['3. Чат и ИИ-помощник','Чат работает в двух режимах. Без согласия пользователя ответы формируются на устройстве, и переписка никуда не отправляется. Если пользователь включил ИИ-помощника, текст сообщений чата (без контактов, координат и журнала) передаётся через сервер GuardAurora на Vercel в Google Gemini API для получения ответа. Сервер GuardAurora не сохраняет переписку. На бесплатном тарифе Google может использовать отправленные сообщения для улучшения своих продуктов, поэтому не указывайте в чате имена, адреса, номера телефонов и другие личные данные. ИИ-помощника можно выключить в разделе правовой информации; переписка в приложении не сохраняется после его закрытия.'],
        ['4. Передача данных и диагностика','GuardAurora не отправляет контакты, координаты и журнал на сервер приложения (о сообщениях чата — в разделе 3). Если пользователь сам открывает координаты в приложении карт, координаты передаются выбранному приложению; при запуске звонка или SMS номер передаётся системному приложению телефона/сообщений. SMS отправляется только после подтверждения пользователя. Условия конфиденциальности выбранных сторонних приложений применяются отдельно. Аналитика не подключена. Sentry не отправляет отчёты об ошибках, пока для сборки не настроен DSN.'],
        ['5. Хранение и удаление','Контакты и журнал хранятся на устройстве до удаления пользователем или удаления приложения. Удалить локальные данные можно на экране «Правовая информация». Временный аудиофайл удаляется при остановке мониторинга или переходе приложения в фон.'],
        ['6. Возраст','Приложение предназначено для пользователей 13 лет и старше. Контакты, координаты и журнал не передаются на сервер GuardAurora; через сервер проходят только сообщения чата, если пользователь включил ИИ-помощника. Родителям и законным представителям следует учитывать локальное хранение контактов, координат и записей событий на устройстве.'],
        ['7. Права пользователя','Вы можете запретить доступ к микрофону и геолокации в настройках устройства, удалить контакты и журнал в приложении или удалить приложение. Учётных записей и серверных копий данных нет.'],
        ['8. Изменения политики','Актуальная версия политики доступна по этому адресу. При изменении функций приложения или обработки данных политика будет обновлена. По вопросам можно написать оператору: <a href="mailto:romiisromie@gmail.com">romiisromie@gmail.com</a>.']
      ]},
      en:{title:'Privacy Policy',updated:'Updated: October 8, 2026',sections:[
        ['1. App operator','GuardAurora is operated by Ramina Ibraimova, Kazakhstan. For privacy and data requests, contact <a href="mailto:romiisromie@gmail.com">romiisromie@gmail.com</a>.'],
        ['2. Data and permissions','Trusted-contact names and phone numbers, activity entries, and coordinates are stored locally on your device. Location permission is requested only when you tap the location control. If permission is already granted, starting SOS takes a single current location reading and adds it to the local SOS entry; there is no background tracking. While monitoring is enabled and the app is open, the microphone measures overall sound level. A temporary audio file is created in the device cache for measurement and deleted when monitoring stops or the app moves to the background. The app does not recognize sounds or threats.'],
        ['3. Chat and AI assistant','The chat has two modes. Without your consent, answers are generated on the device and nothing is sent. If you turn on the AI assistant, the text of your chat messages (not your contacts, coordinates, or activity log) is sent through the GuardAurora server on Vercel to the Google Gemini API to generate a reply. The GuardAurora server does not store conversations. On the free tier, Google may use submitted messages to improve its products, so do not include names, addresses, phone numbers, or other personal details in the chat. You can turn the AI assistant off in the Privacy tab; the conversation is not saved in the app after it closes.'],
        ['4. Data sharing and diagnostics','GuardAurora does not send contacts, coordinates, or the activity log to an app server (for chat messages, see section 3). If you choose to open coordinates in a maps app, they are shared with that app. When you start a call or SMS, the phone number is passed to the selected system app. An SMS is sent only after you confirm it. The selected third-party app’s privacy terms apply separately. Analytics is not enabled. Sentry does not send crash reports unless a DSN is configured for the build.'],
        ['5. Retention and deletion','Contacts and activity are stored on your device until you delete them or remove the app. You can delete local data on the Privacy & Legal screen. The temporary audio file is deleted when monitoring stops or the app moves to the background.'],

        ['7. Your choices','You can deny microphone or location access in your device settings, delete contacts and activity in the app, or remove the app. There are no user accounts or server-side copies of this data.'],

      kk:{title:'Құпиялық саясаты',updated:'Жаңартылған күні: 2026 жылғы 8 қазан',sections:[
        ['1. Қолданба операторы','GuardAurora қолданбасының операторы — Рамина Ибраимова, Қазақстан. Құпиялық және деректерді өңдеу сұрақтары бойынша: <a href="mailto:romiisromie@gmail.com">romiisromie@gmail.com</a>.'],
        ['2. Деректер және рұқсаттар','Сенімді контактінің аты мен телефон нөмірі, оқиғалар журналы және координаттар құрылғыда жергілікті сақталады. Орналасқан жерге рұқсат пайдаланушы тиісті түймені басқанда ғана сұралады. Рұқсат бұрын берілген болса, SOS іске қосылғанда қолданба ағымдағы координаттарды бір рет анықтап, құрылғыдағы SOS жазбасына қосады; фондық бақылау жүргізілмейді. Бақылау қосулы және қолданба ашық кезде микрофон жалпы дыбыс деңгейін өлшейді. Өлшеу үшін құрылғы кэшінде уақытша аудио файл жасалады; бақылау тоқтағанда немесе қолданба фонға өткенде ол өшіріледі. Қолданба дыбыстарды не қауіптерді анықтамайды.'],
        ['3. Чат және ЖИ көмекшісі','Чаттың екі режимі бар. Пайдаланушы келісім бермесе, жауаптар құрылғыда жасалады және хат алмасу ешқайда жіберілмейді. ЖИ көмекшісі қосылса, чат хабарламаларының мәтіні (байланыстарсыз, координаттарсыз және журналсыз) жауап алу үшін Vercel-дегі GuardAurora сервері арқылы Google Gemini API-ге жіберіледі. GuardAurora сервері хат алмасуды сақтамайды. Тегін тарифте Google жіберілген хабарламаларды өз өнімдерін жақсарту үшін пайдалануы мүмкін, сондықтан чатта аты-жөнді, мекенжайды, телефон нөмірлерін және басқа жеке деректерді жазбаңыз. ЖИ көмекшісін құпиялық бөлімінде өшіруге болады; қолданба жабылғаннан кейін хат алмасу сақталмайды.'],
        ['4. Деректерді беру және диагностика','GuardAurora байланыстарды, координаттарды және журналды қолданба серверіне жібермейді (чат хабарламалары туралы 3-бөлімді қараңыз). Пайдаланушы координаттарды карта қолданбасында өзі ашса, координаттар сол қолданбаға беріледі. Қоңырау немесе SMS басталғанда телефон нөмірі таңдалған жүйелік қолданбаға беріледі. SMS пайдаланушы растағаннан кейін ғана жіберіледі. Таңдалған үшінші тарап қолданбасының құпиялық шарттары бөлек қолданылады. Аналитика қосылмаған. Құрастыру үшін DSN бапталмаса, Sentry қателер туралы есептерді жібермейді.'],
        ['5. Сақтау және жою','Контактілер мен журнал пайдаланушы өшіргенше немесе қолданбаны жойғанша құрылғыда сақталады. Жергілікті деректерді «Құқықтық ақпарат» экранында өшіруге болады. Уақытша аудио файл бақылау тоқтағанда немесе қолданба фонға өткенде өшіріледі.'],
        ['6. Жас шектеуі','GuardAurora 13 жастан асқан пайдаланушыларға арналған. Байланыстар, координаттар және журнал GuardAurora серверіне жіберілмейді; ЖИ көмекшісі қосылған жағдайда ғана сервер арқылы чат хабарламалары өтеді. Ата-аналар мен заңды өкілдер контактілер, координаттар және оқиғалар жазбасы құрылғыда жергілікті сақталатынын ескеруі керек.'],
        ['7. Пайдаланушы таңдауы','Құрылғы баптауларында микрофон немесе орналасқан жерге рұқсат бермеуге, қолданбада контактілер мен журналды өшіруге немесе қолданбаны жоюға болады. Пайдаланушы тіркелгілері және деректердің сервердегі көшірмелері жоқ.'],
        ['8. Саясаттың өзгеруі','Саясаттың қазіргі нұсқасы осы мекенжайда жарияланған. Қолданба функциялары немесе деректерді өңдеу өзгерсе, саясат жаңартылады. Сұрақтар бойынша операторға жазыңыз: <a href="mailto:romiisromie@gmail.com">romiisromie@gmail.com</a>.']
      ]}
    };
    const article=document.getElementById('policy');
    function setLanguage(lang){const p=policies[lang];document.documentElement.lang=lang;document.getElementById('page-title').textContent=p.title;document.getElementById('updated').textContent=p.updated;article.lang=lang;article.replaceChildren(...p.sections.flatMap(([heading,body])=>{const h=document.createElement('h2');h.textContent=heading;const para=document.createElement('p');para.innerHTML=body;return [h,para]}));document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)))}
    document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));setLanguage('ru');
  </script>
